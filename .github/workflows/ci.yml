name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
          # SHA-256 de gitleaks_8.18.4_linux_x64.tar.gz (vérifié le 2026-10-27 contre le checksums.txt officiel).
          GITLEAKS_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --redact --no-banner

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install, lint, test (si le dossier existe)
        run: |
          if [ -f backend/pyproject.toml ]; then
            cd backend
            pip install -e ".[dev]"
            ruff check .
            pytest -q
            pip-audit
          else
            echo "backend/ pas encore initialisé"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install, lint, types, test (si le dossier existe)
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm run lint
            npm run typecheck
            npm test -- --run
            npm audit --audit-level=high
          else
            echo "frontend/ pas encore initialisé"
          fi
