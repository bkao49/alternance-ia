name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, lint, test (si le dossier existe)
        run: |
          if [ -f backend/pyproject.toml ]; then
            cd backend
            pip install -e ".[dev]"
            ruff check .
            pytest -q
            pip-audit
          else
            echo "backend/ pas encore initialisé"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, lint, types, test (si le dossier existe)
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm run lint
            npm run typecheck
            npm test -- --run
            npm audit --audit-level=high
          else
            echo "frontend/ pas encore initialisé"
          fi
