[project]
name = "alternance-backend"
version = "0.1.0"
description = "API FastAPI et worker de l'assistant de recherche d'alternance"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "argon2-cffi==25.1.0",
    "itsdangerous==2.2.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "soupsieve==3.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
