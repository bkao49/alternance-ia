# Stack locale : base PostgreSQL + pgvector, migrations, API.
# Caddy arrive avec P6-1. Les variables viennent du fichier .env (voir .env.example).
services:
  db:
    # Propriétaire (POSTGRES_USER) : sert UNIQUEMENT aux migrations. L'API utilise le rôle « app »
    # créé par infra/db/10-roles.sh. Aucun port publié : seule l'API du réseau compose y accède.
    image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: owner
      POSTGRES_DB: app
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est vide : copiez .env.example en .env puis renseignez-le}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?APP_DB_PASSWORD est vide : copiez .env.example en .env puis renseignez-le}"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    # -h 127.0.0.1 : le serveur temporaire d'initialisation n'écoute que sur le socket, donc « healthy » arrive après 10-roles.sh.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U owner -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    # Amorçage ponctuel : applique les migrations en propriétaire, puis s'arrête.
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: "postgresql://owner:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est vide : copiez .env.example en .env puis renseignez-le}@db:5432/app"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql://app:${APP_DB_PASSWORD:?APP_DB_PASSWORD est vide : copiez .env.example en .env puis renseignez-le}@db:5432/app"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY est vide : générez-la (32 caractères minimum) et mettez-la dans .env}"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_DEMO_DATA: ${ALLOW_DEMO_DATA:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_DAILY_CAP_EUR: ${LLM_DAILY_CAP_EUR:-0.50}
      ANTHROPIC_MODEL_FAST: ${ANTHROPIC_MODEL_FAST:-}
      ANTHROPIC_MODEL_QUALITY: ${ANTHROPIC_MODEL_QUALITY:-}
      ANTHROPIC_EUR_PER_MTOK_FAST_IN: ${ANTHROPIC_EUR_PER_MTOK_FAST_IN:-}
      ANTHROPIC_EUR_PER_MTOK_FAST_OUT: ${ANTHROPIC_EUR_PER_MTOK_FAST_OUT:-}
      ANTHROPIC_EUR_PER_MTOK_QUALITY_IN: ${ANTHROPIC_EUR_PER_MTOK_QUALITY_IN:-}
      ANTHROPIC_EUR_PER_MTOK_QUALITY_OUT: ${ANTHROPIC_EUR_PER_MTOK_QUALITY_OUT:-}
      # « Mes sources » dit si la clé de chaque source est présente (jamais sa valeur).
      LBA_API_TOKEN: ${LBA_API_TOKEN:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID:-}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    # Collecte planifiée (ADR 0004) : prend les tâches de la file PostgreSQL, sans port ouvert.
    # Clés des sources facultatives : sans clé, la source s'arrête avec une erreur claire.
    build: ./backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: "postgresql://app:${APP_DB_PASSWORD:?APP_DB_PASSWORD est vide : copiez .env.example en .env puis renseignez-le}@db:5432/app"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY est vide : générez-la (32 caractères minimum) et mettez-la dans .env}"
      COLLECT_INTERVAL_MINUTES: ${COLLECT_INTERVAL_MINUTES:-120}
      LBA_API_TOKEN: ${LBA_API_TOKEN:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_DAILY_CAP_EUR: ${LLM_DAILY_CAP_EUR:-0.50}
      ANTHROPIC_MODEL_FAST: ${ANTHROPIC_MODEL_FAST:-}
      ANTHROPIC_MODEL_QUALITY: ${ANTHROPIC_MODEL_QUALITY:-}
      ANTHROPIC_EUR_PER_MTOK_FAST_IN: ${ANTHROPIC_EUR_PER_MTOK_FAST_IN:-}
      ANTHROPIC_EUR_PER_MTOK_FAST_OUT: ${ANTHROPIC_EUR_PER_MTOK_FAST_OUT:-}
      ANTHROPIC_EUR_PER_MTOK_QUALITY_IN: ${ANTHROPIC_EUR_PER_MTOK_QUALITY_IN:-}
      ANTHROPIC_EUR_PER_MTOK_QUALITY_OUT: ${ANTHROPIC_EUR_PER_MTOK_QUALITY_OUT:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  doctor:
    # Contrôle de l'installation, à la demande : docker compose run --rm doctor (ADR 0011).
    # Reçoit aussi le compte propriétaire de la base, pour lire la version des migrations.
    build: ./backend
    command: ["python", "-m", "app.doctor"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: "postgresql://app:${APP_DB_PASSWORD:?APP_DB_PASSWORD est vide : copiez .env.example en .env puis renseignez-le}@db:5432/app"
      MIGRATION_DATABASE_URL: "postgresql://owner:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est vide : copiez .env.example en .env puis renseignez-le}@db:5432/app"
      SECRET_KEY: "${SECRET_KEY:-}"
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LBA_API_TOKEN: ${LBA_API_TOKEN:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      EMAIL_ALERTS_HOST: ${EMAIL_ALERTS_HOST:-}
      EMAIL_ALERTS_PORT: ${EMAIL_ALERTS_PORT:-}
      EMAIL_ALERTS_USER: ${EMAIL_ALERTS_USER:-}
      EMAIL_ALERTS_PASSWORD: ${EMAIL_ALERTS_PASSWORD:-}
      EMAIL_ALERTS_FOLDER: ${EMAIL_ALERTS_FOLDER:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
